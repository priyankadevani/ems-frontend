<div class="container mt-4">
    <div class="d-flex justify-content-between ">
        <h5>Employee List</h5>
        <button type="button" class="btn btn-primary" matButton="filled"
            *ngIf="permissionService.hasPermission('employee.create')" [routerLink]="'/create'"><i
                class="bi bi-plus"></i>Create Employee</button>
        <!-- <button matButton="filled" (click)="logout()">Logout</button> -->
    </div>


    <div class="d-flex w-50 justify-content-between mt-2">
        <input type=" text" #searchBox placeholder="Search" class="form-control" (input)="searchInput(searchBox.value)"
            style="margin-right:5px" />
        <select [(ngModel)]="sort" (change)="onSortChange()" class="form-control">
            <option value="" selected>Sory By</option>
            <option value="-createdAt">Newest</option>

            <option value="createdAt">Oldest</option>

            <option value="firstName">Name A-Z</option>

            <option value="-firstName">Name Z-A</option>

        </select>
    </div>
    @for(employee of employees() ; track employee._id; let index=$index ){
    <div class="shadow-sm border bg-white p-3 mb-3 mt-2 d-flex align-items-center">

        <div>
            {{index + 1}})
            @if(employee.profileImage && employee.profileImage.url){
            <img [src]="employee.profileImage.url" alt="Employee Image"
                style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd;">
            }
            {{employee.firstName}} {{employee.lastName}} : {{employee.users.email}},
            {{employee.phone}}
        </div>
        <div class="ms-auto d-flex justify-content-between" style="width:70px">
            <button *ngIf="permissionService.hasPermission('employee.update')" (click)="updateEmployee(employee._id)">
                <i class="bi bi-pencil-square"></i>

            </button>
            <!-- <button mat-icon-button [routerLink]="'/details/' + employee._id">
                <mat-icon>
                    visibility
                </mat-icon>
            </button> -->
            <button *ngIf="permissionService.hasPermission('employee.delete')" mat-icon-button color="warn"
                (click)="deleteEmployee(employee._id)">
                <i class="bi bi-trash"></i>

            </button>
        </div>
    </div>
    }
    <button (click)="previousPage()" [disabled]="page==1">

        <!-- <i class="bi bi-arrow-left-square"></i> -->
        Prev

    </button>

    <span>

        Page {{page}} of {{totalPages}}

    </span>

    <button (click)="nextPage()" [disabled]="page==totalPages">

        <!-- <i class="bi bi-arrow-right-square"></i> -->
        Next

    </button>
</div>
