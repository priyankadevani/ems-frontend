<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="row">

                <div class="col-lg-4 text-center border-end">

                    <img [src]="profile()?.profileImage?.url || '/Default-Profile-Picture.png'"
                        class="profile-image mb-3">

                    <h3 class="mb-1">
                        {{ profile()?.fname }}
                        {{ profile()?.lname }}
                    </h3>

                    <p class="text-muted mb-3">
                        {{ profile()?.designation }}
                    </p>


                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editProfileModal">

                        <i class="bi bi-pencil-square me-2"></i>
                        Edit Profile
                    </button>

                </div>

                <div class="col-lg-8">

                    <h4 class="mb-4">
                        Personal Information
                    </h4>

                    <div class="row">

                        <div class="col-md-6 mb-4">
                            <label class="text-muted">Email</label>
                            <h6>{{ profile()?.email }}</h6>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="text-muted">Phone</label>
                            <h6>{{ profile()?.phone }}</h6>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="text-muted">Department</label>
                            <h6>{{ profile()?.department }}</h6>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="text-muted">Designation</label>
                            <h6>{{ profile()?.designation }}</h6>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="text-muted">Joining Date</label>
                            <h6>
                                {{ profile()?.jiningDate | date:'dd MMM yyyy' }}
                            </h6>
                        </div>



                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<div class="modal fade" id="editProfileModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5>Edit Profile</h5>

                <button class="btn-close" data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form [formGroup]="profileForm">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>First Name</label>

                            <input class="form-control" formControlName="firstName">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Last Name</label>

                            <input class="form-control" formControlName="lastName">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Phone</label>

                            <input class="form-control" formControlName="phone">

                        </div>


                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal" id="closeModalBtn">

                    Cancel

                </button>

                <button class="btn btn-primary" (click)="updateProfile()">

                    Save Changes

                </button>

            </div>

        </div>

    </div>

</div>
