<div class="container ">
    <div class="d-flex justify-content-between ">
        <h5>Edit Role </h5>
        <button type="button" class="btn btn-primary" matButton="filled"
            *ngIf="permissionService.hasPermission('role.read')" [routerLink]="'/roles'">
            Back To rolelist</button>
    </div>
    <div class="shadow-sm border bg-white p-3 mb-3 mt-2 " style="width: 60%;">
        <form [formGroup]="roleForm" (ngSubmit)="updateRole()">

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Role Name</label>

                    <input type="text" class="form-control" formControlName="roleName">
                </div>
            </div>
            <hr>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Permssions</label>
                </div>
            </div>

            <div *ngFor="let group of groupedPermissions | keyvalue" class="form-row" style="border: 1px solid darkgrey;
    border-radius: 9px;
    padding: 5px ;margin:5px">

                <div class="form-group col-md-6">
                    <label>{{ group.key | titlecase }}</label>
                </div>

                <div class="form-row">
                    <div class="form-check form-check-inline m-2" *ngFor="let permission of group.value">
                        <input class="form-check-input" type="checkbox" [value]="permission._id"
                            [checked]="isPermissionSelected(permission._id)"
                            (change)="onCheckboxChange($event, permission._id)">

                        <label class="form-check-label">

                            {{ permission.name.split('.')[1] | titlecase }}

                        </label>
                    </div>
                </div>

            </div>
            <div class="mb-3">



                <!-- <div *ngFor="let group of groupedPermissions | keyvalue" class="mb-4">

                    <h6>{{ group.key | titlecase }}</h6>

                    <div *ngFor="let permission of group.value" class="form-check">

                        <input class="form-check-input" type="checkbox" [value]="permission._id"
                            [checked]="isPermissionSelected(permission._id)"
                            (change)="onCheckboxChange($event, permission._id)">

                        <label class="form-check-label">

                            {{ permission.name.split('.')[1] | titlecase }}

                        </label>

                    </div>

                </div> -->

            </div>

            <button class="btn btn-primary" type="submit">

                Update Role

            </button>

        </form>
    </div>
</div>
